  window.db = firebase.database();

  firebase.auth().onAuthStateChanged(user => {
      if (!user) window.location.href = "login.html";

      firebase.auth().signOut().then(() => {
          window.location.href = "login.html";

<script>
// ======================================================
// VARIABLES GLOBALES
// ======================================================
let ventas = [];
let pagos = {};
let abonos = {};
let listeners = { ventas: false, pagos: false, abonos: false };

let clienteSeleccionado = null;
let fechaSeleccionada = null;
let deudaActual = 0;

// ======================================================
// UTILIDADES
// ======================================================
function formatMoney(n) {
    return "$" + Number(n).toLocaleString("es-CL");
}

function keyPago(cliente, fecha) {
    return `${cliente}_${fecha}`;
}

// ======================================================
// MODAL ABONO
// ======================================================
function cerrarModal() {
    document.getElementById("modalAbono").style.display = "none";
    deudaActual = 0;
}

// ======================================================
// GUARDAR ABONO
// ======================================================
async function guardarAbono() {

    const input =
        document.getElementById("monto-abono");

    const monto =
        Number(input.value);

    if (monto <= 0) {
        alert("Monto inválido");
        return;
    }

    if (monto > deudaActual) {
        alert("El abono excede la deuda");
        return;
    }

    const clave =
        keyPago(
            clienteSeleccionado,
            fechaSeleccionada
        );

    try {

        // ==============================================
        // GUARDAR EL ABONO
        // ==============================================

        await db
            .ref("abonos")
            .child(clave)
            .push({
                monto: monto,
                timestamp:
                    firebase.database.ServerValue.TIMESTAMP
            });

        // ==============================================
        // CALCULAR CUÁNTO SE HA ABONADO EN TOTAL
        // ==============================================

        const snap =
            await db
                .ref("abonos")
                .child(clave)
                .once("value");

        const datosAbonos =
            snap.val() || {};

        const totalAbonado =
            Object.values(datosAbonos)
                .reduce(
                    (total, abono) =>
                        total +
                        Number(abono.monto || 0),
                    0
                );

        // ==============================================
        // CALCULAR DEUDA REAL DE LA FECHA
        // ==============================================

        const ventasFecha =
            ventas.filter(v =>
                v.cliente === clienteSeleccionado &&
                v.fecha === fechaSeleccionada
            );

        let totalVentas = 0;

        ventasFecha.forEach(v => {

            totalVentas +=
                Number(v.valor || 0);

        });

        const deudaReal =
            Math.max(
                0,
                totalVentas - totalAbonado
            );

        // ==============================================
        // SI EL ABONO CUBRE TODA LA DEUDA
        // MARCAMOS TODAS LAS VENTAS COMO PAGADAS
        // ==============================================

        if (deudaReal <= 0) {

            for (const venta of ventasFecha) {

                if (!venta.firebaseId) continue;

                await db
                    .ref("ventas")
                    .child(venta.firebaseId)
                    .update({
                        pagada: true
                    });
            }

            // Compatibilidad con sistema antiguo
            await db
                .ref("pagos")
                .child(clave)
                .set(true);

        }

        cerrarModal();

    } catch (e) {

        console.error(
            "Error guardando abono:",
            e
        );

        alert(
            "No fue posible guardar el abono."
        );
    }
}

// ======================================================
// FIREBASE LISTENERS
// ======================================================
function verificarCarga() {
    if (listeners.ventas && listeners.pagos && listeners.abonos) {
        refrescarTodo();
    }
}

function cargarDatos() {
    db.ref("ventas").on("value", snap => {

    const data = snap.val() || {};

    ventas = Object.keys(data).map(
        id => ({
            ...data[id],
            firebaseId: id
        })
    );

    // Actualizar selector de clientes
    cargarSelectorClientes();

    listeners.ventas = true;

    verificarCarga();

});

    db.ref("pagos").on("value", snap => {
        pagos = snap.val() || {};
        listeners.pagos = true;
        verificarCarga();
    });

    db.ref("abonos").on("value", snap => {
        abonos = snap.val() || {};
        listeners.abonos = true;
        verificarCarga();
    });
}

// ======================================================
// ACCIONES
// ======================================================
// ======================================================
// MARCAR TODAS LAS VENTAS DE UNA FECHA COMO PAGADAS
// ======================================================
async function marcarPago(clave) {

    const grupo = ventas.filter(v =>
        keyPago(v.cliente, v.fecha) === clave
    );

    if (!grupo.length) return;

    try {

        for (const v of grupo) {

            if (!v.firebaseId) continue;

            await db
                .ref("ventas")
                .child(v.firebaseId)
                .update({
                    pagada: true
                });
        }

        // Se mantiene también el pago global
        // para compatibilidad con datos antiguos
        await db.ref("pagos").child(clave).set(true);

    } catch (e) {

        console.error(
            "Error marcando ventas como pagadas:",
            e
        );

    }
}


// ======================================================
// REVERTIR TODAS LAS VENTAS DE UNA FECHA
// ======================================================
async function revertirPago(clave) {

    const grupo = ventas.filter(v =>
        keyPago(v.cliente, v.fecha) === clave
    );

    if (!grupo.length) return;

    try {

        for (const v of grupo) {

            if (!v.firebaseId) continue;

            await db
                .ref("ventas")
                .child(v.firebaseId)
                .update({
                    pagada: false
                });
        }

        // También eliminamos el pago global antiguo
        await db.ref("pagos").child(clave).remove();

    } catch (e) {

        console.error(
            "Error revirtiendo pagos:",
            e
        );

    }
}

function abrirModalAbono(cliente, fecha, deuda) {
    clienteSeleccionado = cliente;
    fechaSeleccionada = fecha;
    deudaActual = deuda;
    document.getElementById("monto-abono").value = "";
    document.getElementById("modalAbono").style.display = "flex";
}

async function revertirAbono(clave) {
    await db.ref("abonos").child(clave).remove();
}

async function eliminarGrupo(cliente, fecha) {

    const clave = keyPago(cliente, fecha);

    const confirmar = confirm(
        `⚠️ ¿Seguro que deseas eliminar TODAS las ventas del día ${fecha} para el cliente:\n\n${cliente}?\n\nEsta acción no se puede deshacer.`
    );

    if (!confirmar) return; // CANCELADO

    const grupo = ventas.filter(v => keyPago(v.cliente, v.fecha) === clave);

    for (let v of grupo) {
        await db.ref("ventas").child(v.firebaseId).remove();
    }

    alert("La línea fue eliminada correctamente.");
}

});

                    )

        // ----------------------------------------------

// COMPROBAR PAGO TOTAL DE LA FECHA

if (pagos[clave] === true) {

    // El registro antiguo de "pagos" indica

    pagadoDia = totalDia;

} else {

    // ==================================================

}  

        globalTotal += totalDia;

        globalDeuda += deudaDia;

    });

});
        resumenGlobal.innerHTML = `

       `;

if (todosPagados) {

            <button class="btn-icon" title="Abonar" onclick="abrirModalAbono('${cliente}','${fecha}',${deudaDia})">💰</button>
            <button class="btn-icon" title="Revertir abonos" onclick="revertirAbono('${clave}')">⛔</button>
            <button class="btn-icon" title="Eliminar fecha" onclick="eliminarGrupo('${cliente}','${fecha}')">🗑️</button>
            `;

           tarjeta.appendChild(linea);

       });

        // RESUMEN CLIENTE
       const resumen = document.createElement("div");
       resumen.className = "resumen-cliente";
      resumen.innerHTML = `
    <span><strong>Total:</strong> ${formatMoney(totalCliente)}</span>
    <span style="color:#1a7f1a"><strong>Pagado:</strong> ${formatMoney(pagadoCliente)}</span>
    <span style="color:#CCA90E"><strong>Adeudado:</strong> ${formatMoney(deudaCliente)}</span>
`  ;
   tarjeta.appendChild(resumen);

// ===============================
// OCULTAR TARJETAS 100% PAGADAS
// SOLO CUANDO EL MES ES ESPECÍFICO
// ===============================
const mesSeleccionado = document.getElementById("selector-mes").value;

if (mesSeleccionado !== "todos") {
    // si TODO está pagado = tarjeta NO se muestra
    if (deudaCliente <= 0) {
        return; // no agregar tarjeta
    }
}

// si llega hasta aquí la tarjeta sí se muestra
cont.appendChild(tarjeta);

    });
}
// ======================================================
// CARGAR SELECTOR DE CLIENTES
// ======================================================
function cargarSelectorClientes() {

    const selector =
        document.getElementById("selector-cliente");

    if (!selector) return;

    // Mantener solamente "Todos"
    selector.innerHTML =
        '<option value="todos">Todos</option>';

    const clientes = [
        ...new Set(
            ventas
                .map(v => v.cliente)
                .filter(cliente => cliente)
        )
    ].sort((a, b) =>
        a.localeCompare(b, "es", {
            sensitivity: "base"
        })
    );

    clientes.forEach(cliente => {

        const option =
            document.createElement("option");

        option.value = cliente;
        option.textContent = cliente;

        selector.appendChild(option);

    });
}
// ======================================================
// INICIALIZACIÓN
// ======================================================
window.onload = function() {
    // AÑOS
    const selAno = document.getElementById("selector-ano");
    const año = new Date().getFullYear();
    for (let i = año - 5; i <= año + 1; i++) {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = i;
        if (i === año) o.selected = true;
        selAno.appendChild(o);
    }

    cargarDatos();
    

    document.getElementById("selector-cliente").addEventListener("change", refrescarTodo);
    document.getElementById("selector-mes").addEventListener("change", refrescarTodo);
    document.getElementById("selector-ano").addEventListener("change", refrescarTodo);

    document.getElementById("guardarAbono").addEventListener("click", guardarAbono);

    window.onclick = function(e) {
        if (e.target === document.getElementById("modalAbono")) cerrarModal();
    };
};
