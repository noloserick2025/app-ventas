<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Envios</title>

<style>

body{
font-family:Arial;
background:#f2f4f8;
margin:0;
padding:10px;
}

h2{
text-align:center;
margin-bottom:15px;
}

#listaEnvios{
display:flex;
flex-direction:column;
gap:10px;
}

.tarjeta-envio{
background:white;
border-radius:10px;
padding:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.linea-envio{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:6px;
}

.numero{
font-weight:bold;
display:flex;
align-items:center;
gap:4px;
color:#2c3e50;
}

.producto{
flex:1;
font-size:14px;
}

.acciones{
display:flex;
gap:4px;
flex-wrap:wrap;
}

button{
border:none;
padding:5px 8px;
border-radius:6px;
font-size:12px;
cursor:pointer;
}

.btn-enviar{
background:#3498db;
color:white;
}

.btn-enviar:hover{
background:#2980b9;
}

.btn-ocultar{
background:#e74c3c;
color:white;
}

.fecha-enviado{
margin-top:5px;
font-size:12px;
color:#27ae60;
font-weight:bold;
}

input[type=date]{
font-size:12px;
padding:3px;
}

@media(max-width:600px){

.linea-envio{
flex-direction:column;
align-items:flex-start;
}

.acciones{
width:100%;
}

}

</style>

</head>

<body>

<h2>📦 Envios</h2>

<div id="listaEnvios"></div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- TU CONFIGURACION EXISTENTE -->
<script src="firebase-config.js"></script>


<script>

// ======================================================
// FIREBASE
// ======================================================

const db = firebase.database();

const contenedor =
    document.getElementById("listaEnvios");

let ventas = {};
let estadosEnvio = {};

let usuarioActual = null;


// ======================================================
// COMPROBAR AUTENTICACIÓN
// ======================================================

firebase.auth().onAuthStateChanged(function(user) {

    if (!user) {

        console.log(
            "ENVÍOS: no hay usuario autenticado."
        );

        contenedor.innerHTML =
            "<p>No hay una sesión iniciada.</p>";

        return;
    }

    usuarioActual = user;

    console.log(
        "ENVÍOS: usuario autenticado:",
        user.email
    );

    iniciarEnvios();

});


// ======================================================
// INICIAR ENVÍOS
// ======================================================

function iniciarEnvios() {

    const refVentas =
        db.ref("ventas");

    const refEnvios =
        db.ref("envios");


    // ==============================================
    // CARGAR VENTAS
    // ==============================================

    refVentas.on("value", snapshot => {

        ventas =
            snapshot.val() || {};

        console.log(
            "ENVÍOS: ventas cargadas:",
            Object.keys(ventas).length
        );

        mostrarEnvios();

    });


    // ==============================================
    // CARGAR ESTADOS DE ENVÍO
    // ==============================================

    refEnvios.on("value", snapshot => {

        estadosEnvio =
            snapshot.val() || {};

        mostrarEnvios();

    });

}


// ======================================================
// MOSTRAR ENVÍOS
// ======================================================

// ======================================================
// MOSTRAR ENVÍOS AGRUPADOS POR CLIENTE
// ======================================================

function mostrarEnvios() {

    contenedor.innerHTML = "";

    const clientes = {};


    // ==================================================
    // RECORRER VENTAS
    // ==================================================

    Object.keys(ventas).forEach(id => {

        const data = ventas[id];

        if (!data) return;


        // ==================================================
        // SOLO VENTAS MARCADAS PARA ENVÍO
        // ==================================================

        if (data.enviar !== true) return;


        // ==================================================
        // ESTADO PROPIO DE ENVÍOS
        // ==================================================

        const estado =
            estadosEnvio[id] || {};


        // Si está oculto, no mostrar
        if (estado.oculto) return;


        // ==================================================
        // CLIENTE
        // ==================================================

        const cliente =
            data.cliente || "Cliente sin nombre";


        if (!clientes[cliente]) {
            clientes[cliente] = [];
        }


        clientes[cliente].push({

            id: id,

            data: data,

            estado: estado

        });

    });


    // ==================================================
    // SI NO HAY ENVÍOS
    // ==================================================

    if (Object.keys(clientes).length === 0) {

        contenedor.innerHTML =
            "<p>No hay productos marcados para envío.</p>";

        return;

    }


    // ==================================================
    // ORDENAR CLIENTES
    // ==================================================

    const nombresClientes =
        Object.keys(clientes).sort((a, b) =>
            a.localeCompare(b, "es")
        );


    // ==================================================
    // CREAR TARJETA POR CLIENTE
    // ==================================================

    nombresClientes.forEach(cliente => {

        const tarjeta =
            document.createElement("div");

        tarjeta.className =
            "tarjeta-envio";


        // ==================================================
        // NOMBRE DEL CLIENTE
        // ==================================================

        const titulo =
            document.createElement("h3");

        titulo.textContent =
            cliente;

        titulo.style.margin =
            "0 0 10px 0";


        tarjeta.appendChild(titulo);


        // ==================================================
        // ORDENAR PRODUCTOS POR FECHA
        // MÁS RECIENTE PRIMERO
        // ==================================================

        clientes[cliente].sort((a, b) => {

            const fechaA =
                a.data.fecha || "";

            const fechaB =
                b.data.fecha || "";

            return fechaB.localeCompare(fechaA);

        });


        // ==================================================
        // CREAR CADA PRODUCTO
        // ==================================================

        clientes[cliente].forEach(item => {

            const id =
                item.id;

            const data =
                item.data;

            const estado =
                item.estado;


            // ==================================================
            // DATOS
            // ==================================================

            const numero =
                data.correlativo ||
                data.numero ||
                "";

            const producto =
                data.producto ||
                data.descripcion ||
                data.detalle ||
                "";

            const fecha =
                data.fecha ||
                "";

            const fechaEnvio =
                estado.fechaEnvio ||
                "";

            const checked =
                estado.check === true;


            // ==================================================
            // LÍNEA DEL PRODUCTO
            // ==================================================

            const linea =
                document.createElement("div");

            linea.className =
                "linea-envio";


            // ==================================================
            // NÚMERO + CHECK
            // ==================================================

            const numeroDiv =
                document.createElement("div");

            numeroDiv.className =
                "numero";


            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.checked =
                checked;

            checkbox.onchange = () => {

                marcarCheck(
                    id,
                    checkbox.checked
                );

            };


            numeroDiv.appendChild(
                checkbox
            );


            const numeroTexto =
                document.createTextNode(
                    ` #${numero}`
                );

            numeroDiv.appendChild(
                numeroTexto
            );


            // ==================================================
            // PRODUCTO
            // ==================================================

            const productoDiv =
                document.createElement("div");

            productoDiv.className =
                "producto";

            productoDiv.textContent =
                producto;


            // ==================================================
            // FECHA DE LA VENTA
            // ==================================================

            const fechaDiv =
                document.createElement("div");

            fechaDiv.style.fontSize =
                "12px";

            fechaDiv.style.color =
                "#666";

            fechaDiv.textContent =
                fecha;


            // ==================================================
            // ACCIONES
            // ==================================================

            const acciones =
                document.createElement("div");

            acciones.className =
                "acciones";


            // --------------------------------------------------
            // FECHA DE ENVÍO
            // --------------------------------------------------

            const inputFecha =
                document.createElement("input");

            inputFecha.type =
                "date";

            inputFecha.value =
                fechaEnvio;

            inputFecha.onchange = () => {

                guardarFecha(
                    id,
                    inputFecha.value
                );

            };


            // --------------------------------------------------
            // BOTÓN ENVIAR
            // --------------------------------------------------

            const btnEnviar =
                document.createElement("button");

            btnEnviar.className =
                "btn-enviar";

            btnEnviar.textContent =
                "Enviar";

            btnEnviar.onclick = () => {

                marcarEnviado(id);

            };


            // --------------------------------------------------
            // BOTÓN OCULTAR
            // --------------------------------------------------

            const btnOcultar =
                document.createElement("button");

            btnOcultar.className =
                "btn-ocultar";

            btnOcultar.textContent =
                "X";

            btnOcultar.onclick = () => {

                ocultarEnvio(id);

            };


            acciones.append(
                inputFecha,
                btnEnviar,
                btnOcultar
            );


            // ==================================================
            // AGREGAR A LA LÍNEA
            // ==================================================

            linea.append(
                numeroDiv,
                productoDiv,
                fechaDiv,
                acciones
            );


            tarjeta.appendChild(
                linea
            );


            // ==================================================
            // FECHA ENVIADO
            // ==================================================

            if (fechaEnvio) {

                const fechaEnviado =
                    document.createElement("div");

                fechaEnviado.className =
                    "fecha-enviado";

                fechaEnviado.textContent =
                    `Enviado el ${fechaEnvio}`;

                tarjeta.appendChild(
                    fechaEnviado
                );

            }

        });


        // ==================================================
        // AGREGAR TARJETA AL CONTENEDOR
        // ==================================================

        contenedor.appendChild(
            tarjeta
        );

    });

}


// ======================================================
// MARCAR CHECK
// ======================================================

function marcarCheck(id, estado) {

    refEnvios
        .child(id)
        .update({
            check: estado
        });

}


// ======================================================
// GUARDAR FECHA
// ======================================================

function guardarFecha(id, fecha) {

    refEnvios
        .child(id)
        .update({
            fechaEnvio: fecha
        });

}


// ======================================================
// MARCAR COMO ENVIADO
// ======================================================

function marcarEnviado(id) {

    const hoy =
        new Date()
            .toISOString()
            .split("T")[0];


    refEnvios
        .child(id)
        .update({

            fechaEnvio: hoy

        });

}


// ======================================================
// OCULTAR ENVÍO
// ======================================================

function ocultarEnvio(id) {

    refEnvios
        .child(id)
        .update({

            oculto: true

        });

}

</script>

</body>
</html>
