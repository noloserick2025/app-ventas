<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Envíos</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="firebase-config.js"></script>

<style>

body{
font-family:system-ui;
background:#f0f2f5;
margin:0;
}

nav{
background:#2c3e50;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
margin-right:20px;
}

.contenido{
padding:15px;
max-width:1100px;
margin:auto;
}

.panel-superior{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.filtros{
display:flex;
gap:10px;
flex-wrap:wrap;
}

input{
padding:8px;
border:1px solid #ccc;
border-radius:6px;
}

.cliente-reporte{
background:#60E342;
border-radius:14px;
padding:14px;
margin-bottom:14px;
}

.cliente-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.producto-item{
background:white;
border-radius:8px;
padding:8px;
margin:6px 0;
border-left:6px solid transparent;
}

.status-pendiente{
border-left-color:#f1c40f;
background:#fff9db;
}

.status-enviado{
border-left-color:#27ae60;
background:#e8f5e9;
}

.status-entregado{
border-left-color:#2980b9;
background:#e3f2fd;
}

.producto-fila-main{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.btn{
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-size:11px;
font-weight:bold;
}

.btn-enviar{background:#27ae60;color:white;}
.btn-entregar{background:#2980b9;color:white;}
.btn-revertir{background:#e74c3c;color:white;}

.msg-enviado{
font-size:10px;
font-weight:bold;
color:#1b5e20;
margin-top:4px;
}

</style>
</head>

<body>

<nav>
<div>
<a href="index.html">⬅ VENTAS</a>
<a href="envios.html">ENVÍOS</a>
</div>
</nav>

<div class="contenido">

<div class="panel-superior">

<div class="filtros">

<div>
<label>FECHA</label>
<input type="date" id="f-fecha">
</div>

<div>
<label>CLIENTE</label>
<input type="text" id="f-cliente">
</div>

</div>

</div>

<div id="reporte-envios"></div>

</div>

<script>

const db = firebase.database();

let ventasData = [];
let ocultos = [];

/* escuchar ventas realtime */

db.ref("ventas").on("value",snap=>{

const val=snap.val();

ventasData = val
? Object.keys(val).map(k=>({...val[k],firebaseId:k}))
: [];

mostrarEnvios();

});

/* escuchar ocultos realtime */

db.ref("envios_ocultos").on("value",snap=>{

ocultos = snap.val()?Object.keys(snap.val()):[];

mostrarEnvios();

});

function mostrarEnvios(){

const cont=document.getElementById("reporte-envios");

const fFecha=document.getElementById("f-fecha").value;

const fCliente=document.getElementById("f-cliente").value.toUpperCase();

let html="";

const agrupado={};

ventasData.forEach(v=>{

const fecha=v.fecha?v.fecha.split("T")[0]:"";

if(fFecha && fecha!==fFecha)return;

if(fCliente && !v.cliente.toUpperCase().includes(fCliente))return;

const clave=v.cliente+"_"+fecha;

if(!agrupado[clave]){

agrupado[clave]={
cliente:v.cliente,
fecha:fecha,
items:[]
};

}

agrupado[clave].items.push(v);

});

Object.keys(agrupado).forEach(clave=>{

if(ocultos.includes(clave))return;

const grupo=agrupado[clave];

html+=`

<div class="cliente-reporte">

<div class="cliente-header">

<div>
<b>${grupo.cliente}</b><br>
<small>${grupo.fecha}</small>
</div>

<button onclick="ocultar('${clave}')">❌</button>

</div>

`;

grupo.items.forEach(item=>{

let estado="status-pendiente";

if(item.entregado)estado="status-entregado";
else if(item.enviado)estado="status-enviado";

let icono="🟡";

if(item.entregado)icono="✅";
else if(item.enviado)icono="📦";

const msg=item.fechaEnvioReal
? `<div class="msg-enviado">📦 ENVIADO EL ${item.fechaEnvioReal}</div>`
: "";

html+=`

<div class="producto-item ${estado}">

<div class="producto-fila-main">

<span style="flex:1">
${icono} <b>${item.cantidad}</b> - ${item.producto}
</span>

<input type="date"
id="cal-${item.firebaseId}"
value="${item.fechaEnvioReal||""}">

<button class="btn btn-enviar"
onclick="accion('${item.firebaseId}','env')">
Enviar
</button>

<button class="btn btn-entregar"
onclick="accion('${item.firebaseId}','ent')">
Entregar
</button>

<button class="btn btn-revertir"
onclick="accion('${item.firebaseId}','rev')">
↺
</button>

</div>

${msg}

</div>

`;

});

html+="</div>";

});

cont.innerHTML=html;

}

function accion(id,tipo){

const ref=db.ref("ventas/"+id);

if(tipo==="env"){

const fecha=document.getElementById("cal-"+id).value
|| new Date().toISOString().split("T")[0];

ref.update({
enviado:true,
fechaEnvioReal:fecha
});

}

else if(tipo==="ent"){

ref.update({
entregado:true,
enviado:true
});

}

else{

ref.update({
enviado:false,
entregado:false,
fechaEnvioReal:null
});

}

}

function ocultar(clave){

db.ref("envios_ocultos/"+clave).set(true);

}

</script>

</body>
</html>
