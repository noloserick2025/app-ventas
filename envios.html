<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Envios</title>

<style>

body{
font-family:Arial;
background:#f2f4f8;
margin:0;
padding:10px;
}

h2{
text-align:center;
margin-bottom:15px;
}

#listaEnvios{
display:flex;
flex-direction:column;
gap:10px;
}

.tarjeta-envio{
background:white;
border-radius:10px;
padding:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.linea-envio{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:6px;
}

.numero{
font-weight:bold;
display:flex;
align-items:center;
gap:4px;
color:#2c3e50;
}

.producto{
flex:1;
font-size:14px;
}

.acciones{
display:flex;
gap:4px;
flex-wrap:wrap;
}

button{
border:none;
padding:5px 8px;
border-radius:6px;
font-size:12px;
cursor:pointer;
}

.btn-enviar{
background:#3498db;
color:white;
}

.btn-enviar:hover{
background:#2980b9;
}

.btn-ocultar{
background:#e74c3c;
color:white;
}

.fecha-enviado{
margin-top:5px;
font-size:12px;
color:#27ae60;
font-weight:bold;
}

input[type=date]{
font-size:12px;
padding:3px;
}

@media(max-width:600px){

.linea-envio{
flex-direction:column;
align-items:flex-start;
}

.acciones{
width:100%;
}

}

</style>

</head>

<body>

<h2>📦 Envios</h2>

<div id="listaEnvios"></div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- TU CONFIGURACION EXISTENTE -->
<script src="firebase-config.js"></script>


<script>

const db = firebase.database();
const refEnvios = db.ref("envios");

const contenedor = document.getElementById("listaEnvios");


refEnvios.on("value",(snapshot)=>{

contenedor.innerHTML="";

snapshot.forEach((child)=>{

const data = child.val();
const id = child.key;

if(data.oculto) return;

let fechaTexto="";

if(data.fechaEnvio){

fechaTexto = `
<div class="fecha-enviado">
Enviado el ${data.fechaEnvio}
</div>
`

}

const tarjeta = document.createElement("div");
tarjeta.className="tarjeta-envio";

tarjeta.innerHTML = `

<div class="linea-envio">

<div class="numero">

<input type="checkbox"
${data.check ? "checked":""}
onchange="marcarCheck('${id}',this.checked)">

#${data.numero || ""}

</div>

<div class="producto">
${data.producto || ""}
</div>

<div class="acciones">

<input type="date"
value="${data.fechaEnvio || ""}"
onchange="guardarFecha('${id}',this.value)">

<button class="btn-enviar"
onclick="marcarEnviado('${id}')">
Enviar
</button>

<button class="btn-ocultar"
onclick="ocultarEnvio('${id}')">
X
</button>

</div>

</div>

${fechaTexto}

`;

contenedor.appendChild(tarjeta);

});

});


function marcarCheck(id,estado){

db.ref("envios/"+id).update({

check:estado

});

}


function guardarFecha(id,fecha){

db.ref("envios/"+id).update({

fechaEnvio:fecha

});

}


function marcarEnviado(id){

const hoy = new Date().toISOString().split("T")[0];

db.ref("envios/"+id).update({

fechaEnvio:hoy

});

}


function ocultarEnvio(id){

db.ref("envios/"+id).update({

oculto:true

});

}

</script>

</body>
</html>
