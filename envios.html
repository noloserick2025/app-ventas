<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Envios</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#eef2f6;
    margin:0;
    padding:15px;
    color:#2c3e50;
}

h2{
    text-align:center;
    margin:5px 0 18px 0;
    color:#2c3e50;
}


/* ======================================================
   CONTENEDOR GENERAL
   ====================================================== */

#listaEnvios{
    display:flex;
    flex-direction:column;
    gap:16px;
}


/* ======================================================
   TARJETA DEL CLIENTE
   ====================================================== */

.tarjeta-envio{
    background:#ffffff;
    border-radius:12px;
    padding:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.10);
    border:1px solid #dfe5eb;
}


/* ======================================================
   TITULO CLIENTE
   ====================================================== */

.tarjeta-envio h3{
    font-size:18px;
    font-weight:bold;
    margin:0 0 12px 0 !important;
    padding:10px 12px !important;

    background:#e5eef7 !important;

    color:#24445f !important;

    border-radius:8px;

    border-left:5px solid #3498db;
}


/* ======================================================
   TARJETA DE CADA FECHA
   ====================================================== */

.tarjeta-envio > div{
    box-sizing:border-box;
}





/* ======================================================
   ENCABEZADO FECHA
   ====================================================== */

.tarjeta-envio div[style*="background"] > div:first-child{
    background:#edf3f8;

    padding:7px 9px;

    border-radius:6px;

    margin-bottom:8px !important;

    color:#34495e !important;

    font-size:14px;
}


/* ======================================================
   LÍNEA DE PRODUCTO
   ====================================================== */

.linea-envio{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;

    min-height:42px;
    box-sizing:border-box;

    padding:7px !important;
    margin-bottom:6px;

    border-radius:8px;

    background:#ffffff !important;
    border:1px solid #eeeeee !important;

    transition:
        background 0.2s ease,
        border 0.2s ease,
        transform 0.15s ease;
}

.linea-envio.linea-marcada{
    background:#41cc4c !important;
    border:1px solid #1a7730 !important;
}


/* ======================================================
   EFECTO AL PASAR EL MOUSE
   ====================================================== */

.linea-envio:hover{
    transform:translateY(-1px);
}


/* ======================================================
   NÚMERO + CHECK
   ====================================================== */

.numero{
    font-weight:bold;

    display:flex;
    align-items:center;

    gap:5px;

    color:#2c3e50;

    min-width:65px;
}


/* ======================================================
   CHECK
   ====================================================== */

.numero input[type="checkbox"]{
    width:18px;
    height:18px;

    cursor:pointer;

    accent-color:#27ae60;
}


/* ======================================================
   PRODUCTO
   ====================================================== */

.producto{
    flex:1;

    font-size:14px;

    font-weight:500;

    min-width:140px;

    color:#34495e;
}


/* ======================================================
   ACCIONES
   ====================================================== */

.acciones{
    display:flex;

    align-items:center;

    gap:5px;

    flex-wrap:wrap;
}


/* ======================================================
   BOTONES
   ====================================================== */

button{
    border:none;

    padding:6px 9px;

    border-radius:6px;

    font-size:12px;

    cursor:pointer;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}

button:hover{
    transform:scale(1.04);
}

button:active{
    transform:scale(0.97);
}


/* ======================================================
   BOTÓN ENVIAR
   ====================================================== */

.btn-enviar{
    background:#3498db;

    color:white;
}

.btn-enviar:hover{
    background:#2980b9;
}


/* ======================================================
   BOTÓN OCULTAR
   ====================================================== */

.btn-ocultar{
    background:#e74c3c;

    color:white;

    font-weight:bold;
}

.btn-ocultar:hover{
    background:#c0392b;
}


/* ======================================================
   FECHA DE ENVÍO
   ====================================================== */

input[type="date"]{
    font-size:12px;

    padding:5px;

    border:1px solid #ccd6df;

    border-radius:6px;

    background:white;

    color:#34495e;
}


/* ======================================================
   TEXTO "ENVIADO EL..."
   ====================================================== */

.fecha-enviado{
    margin-top:5px;

    margin-bottom:5px;

    padding:5px 8px;

    font-size:12px;

    color:#1e8449;

    background:#eaf7ee;

    border-radius:5px;

    font-weight:bold;
}


/* ======================================================
   MENSAJE SIN ENVÍOS
   ====================================================== */

#listaEnvios > p{
    text-align:center;

    background:white;

    padding:20px;

    border-radius:10px;

    color:#7f8c8d;

    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}


/* ======================================================
   CELULAR
   ====================================================== */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .tarjeta-envio{
        padding:9px;
    }

    .tarjeta-envio h3{
        font-size:16px;
    }

    .linea-envio{
        flex-direction:row;

        align-items:center;

        gap:6px;

        padding:7px !important;
    }

    .numero{
        min-width:58px;
    }

    .producto{
        flex:1;

        min-width:100px;

        font-size:13px;
    }

    .acciones{
        width:100%;

        margin-top:4px;

        padding-left:2px;
    }

    .acciones input[type="date"]{
        flex:1;

        min-width:120px;
    }

    .acciones button{
        flex:0 0 auto;
    }

}

</style>

</head>

<body>
<nav style="display: flex; justify-content: space-between; font: size 50px; align-items: center; background: #86b6e6; color: white; padding: 10px 25px; height: 50px;">
    <div class="nav-links" style="display: flex; gap: 40px; ">
        <a href="index.html">VENTAS</a>
        <a href="control.html">CONTROL</a>
        
    </div>
</nav>
    <h1>📦 Envios</h1>


<div id="listaEnvios"></div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- TU CONFIGURACION EXISTENTE -->
<script src="firebase-config.js"></script>


<script>

// ======================================================
// FIREBASE
// ======================================================

const db = firebase.database();

const contenedor =
    document.getElementById("listaEnvios");

const refEnvios =
    db.ref("envios");

let ventas = {};
let estadosEnvio = {};

let usuarioActual = null;


// ======================================================
// COMPROBAR AUTENTICACIÓN
// ======================================================

firebase.auth().onAuthStateChanged(function(user) {

    if (!user) {

        console.log(
            "ENVÍOS: no hay usuario autenticado."
        );

        contenedor.innerHTML =
            "<p>No hay una sesión iniciada.</p>";

        return;
    }

    usuarioActual = user;

    console.log(
        "ENVÍOS: usuario autenticado:",
        user.email
    );

    iniciarEnvios();

});


// ======================================================
// INICIAR ENVÍOS
// ======================================================

function iniciarEnvios() {

    const refVentas =
        db.ref("ventas");

   


    // ==============================================
    // CARGAR VENTAS
    // ==============================================

    refVentas.on("value", snapshot => {

        ventas =
            snapshot.val() || {};

        console.log(
            "ENVÍOS: ventas cargadas:",
            Object.keys(ventas).length
        );

        mostrarEnvios();

    });


    // ==============================================
    // CARGAR ESTADOS DE ENVÍO
    // ==============================================

    refEnvios.on("value", snapshot => {

        estadosEnvio =
            snapshot.val() || {};

        mostrarEnvios();

    });

}


// ======================================================
// MOSTRAR ENVÍOS
// ======================================================

// ======================================================
// MOSTRAR ENVÍOS AGRUPADOS POR CLIENTE
// ======================================================

function mostrarEnvios() {

    contenedor.innerHTML = "";

    const clientes = {};


    // ==================================================
    // AGRUPAR VENTAS POR CLIENTE
    // ==================================================

    Object.keys(ventas).forEach(id => {

        const data = ventas[id];

        if (!data) return;

        // Solo ventas marcadas para envío desde INDEX
        if (data.enviar !== true) return;

        const estado = estadosEnvio[id] || {};

        // Si está oculto no mostrar
        if (estado.oculto) return;

        const cliente =
            data.cliente || "Cliente sin nombre";

        if (!clientes[cliente]) {
            clientes[cliente] = [];
        }

        clientes[cliente].push({
            id,
            data,
            estado
        });

    });


    // ==================================================
    // SIN ENVÍOS
    // ==================================================

    if (Object.keys(clientes).length === 0) {

        contenedor.innerHTML =
            "<p>No hay productos marcados para envío.</p>";

        return;
    }


    // ==================================================
    // ORDENAR CLIENTES
    // ==================================================

    const nombresClientes =
        Object.keys(clientes).sort((a, b) =>
            a.localeCompare(b, "es")
        );


    // ==================================================
    // TARJETA PRINCIPAL DEL CLIENTE
    // ==================================================

    nombresClientes.forEach(cliente => {

        const tarjetaCliente =
            document.createElement("div");

        tarjetaCliente.className =
            "tarjeta-envio";


        // ==================================================
        // ENCABEZADO CLIENTE
        // ==================================================

        const tituloCliente =
            document.createElement("h3");

        tituloCliente.textContent =
            cliente;

        tituloCliente.style.margin =
            "0 0 12px 0";

        tituloCliente.style.padding =
            "8px 10px";

        tituloCliente.style.borderRadius =
            "8px";

        tituloCliente.style.background =
            "#e8f1f8";

        tituloCliente.style.color =
            "#2c3e50";

        tarjetaCliente.appendChild(
            tituloCliente
        );


        // ==================================================
        // AGRUPAR POR FECHA
        // ==================================================

        const fechas = {};

        clientes[cliente].forEach(item => {

            const fecha =
                item.data.fecha || "Sin fecha";

            if (!fechas[fecha]) {
                fechas[fecha] = [];
            }

            fechas[fecha].push(item);

        });


        // ==================================================
        // ORDENAR FECHAS
        // MÁS RECIENTE PRIMERO
        // ==================================================

        const fechasOrdenadas =
            Object.keys(fechas).sort((a, b) =>
                b.localeCompare(a)
            );


        // ==================================================
        // CREAR TARJETA POR FECHA
        // ==================================================

        fechasOrdenadas.forEach(fecha => {

            const tarjetaFecha =
                document.createElement("div");

            tarjetaFecha.style.background =
                "#f8fafc";

            tarjetaFecha.style.border =
                "1px solid #dfe6ec";

            tarjetaFecha.style.borderRadius =
                "8px";

            tarjetaFecha.style.padding =
                "8px";

            tarjetaFecha.style.marginBottom =
                "10px";


            // ==================================================
            // ENCABEZADO FECHA
            // ==================================================

            const encabezadoFecha =
                document.createElement("div");

            encabezadoFecha.style.fontWeight =
                "bold";

            encabezadoFecha.style.marginBottom =
                "7px";

            encabezadoFecha.style.color =
                "#34495e";

            encabezadoFecha.textContent =
                `📅 ${fecha}`;

            tarjetaFecha.appendChild(
                encabezadoFecha
            );


            // ==================================================
            // ORDENAR PRODUCTOS
            // ==================================================

            fechas[fecha].sort((a, b) => {

                const numeroA =
                    Number(
                        a.data.correlativo ||
                        a.data.numero ||
                        0
                    );

                const numeroB =
                    Number(
                        b.data.correlativo ||
                        b.data.numero ||
                        0
                    );

                return numeroA - numeroB;

            });


            // ==================================================
            // PRODUCTOS DE LA FECHA
            // ==================================================

            fechas[fecha].forEach(item => {

                const id =
                    item.id;

                const data =
                    item.data;

                const estado =
                    item.estado;


                // ==================================================
                // LÍNEA
                // ==================================================

                const linea =
                    document.createElement("div");

                linea.className =
                    "linea-envio";


                // ==================================================
                // COLOR SEGÚN CHECK
                // ==================================================

                if (estado.check === true) {
    linea.classList.add("linea-marcada");
}


                linea.style.marginBottom =
                    "6px";


                // ==================================================
                // CHECK
                // ==================================================

                const numeroDiv =
                    document.createElement("div");

                numeroDiv.className =
                    "numero";


                const checkbox =
                    document.createElement("input");

                checkbox.type =
                    "checkbox";

                checkbox.checked =
                    estado.check === true;


                checkbox.onchange = async () => {

    const nuevoEstado =
        checkbox.checked;

    // Cambio visual inmediato
    linea.classList.toggle(
        "linea-marcada",
        nuevoEstado
    );

    // Guardar Firebase
    await marcarCheck(
        id,
        nuevoEstado
    );

};


                numeroDiv.appendChild(
                    checkbox
                );


                const numeroTexto =
                    document.createTextNode(
                        ` ${
                            data.correlativo ||
                            data.numero ||
                            ""
                        }`
                    );

                numeroDiv.appendChild(
                    numeroTexto
                );


                // ==================================================
                // PRODUCTO
                // ==================================================

                const productoDiv =
                    document.createElement("div");

                productoDiv.className =
                    "producto";

                productoDiv.textContent =
                    data.producto ||
                    data.descripcion ||
                    data.detalle ||
                    "";


                // ==================================================
                // ACCIONES
                // ==================================================

                const acciones =
                    document.createElement("div");

                acciones.className =
                    "acciones";


                // ==================================================
                // FECHA ENVÍO
                // ==================================================

                const inputFecha =
                    document.createElement("input");

                inputFecha.type =
                    "date";

                inputFecha.value =
                    estado.fechaEnvio || "";


                inputFecha.onchange = () => {

                    guardarFecha(
                        id,
                        inputFecha.value
                    );

                };


                // ==================================================
                // BOTÓN ENVIAR
                // ==================================================

                const btnEnviar =
                    document.createElement("button");

                btnEnviar.className =
                    "btn-enviar";

                btnEnviar.textContent =
                    "Enviar";

                btnEnviar.onclick = () => {

                    marcarEnviado(id);

                };


                // ==================================================
                // BOTÓN OCULTAR
                // ==================================================

                const btnOcultar =
                    document.createElement("button");

                btnOcultar.className =
                    "btn-ocultar";

                btnOcultar.textContent =
                    "X";

                btnOcultar.onclick = () => {

                    ocultarEnvio(id);

                };


                acciones.append(
                    inputFecha,
                    btnEnviar,
                    btnOcultar
                );


                // ==================================================
                // ARMAR LÍNEA
                // ==================================================

                linea.append(
                    numeroDiv,
                    productoDiv,
                    acciones
                );


                tarjetaFecha.appendChild(
                    linea
                );


                // ==================================================
                // FECHA ENVIADO
                // ==================================================

                if (estado.fechaEnvio) {

                    const fechaEnviado =
                        document.createElement("div");

                    fechaEnviado.className =
                        "fecha-enviado";

                    fechaEnviado.textContent =
                        `Enviado el ${estado.fechaEnvio}`;

                    tarjetaFecha.appendChild(
                        fechaEnviado
                    );

                }

            });


            tarjetaCliente.appendChild(
                tarjetaFecha
            );

        });


        // ==================================================
        // AGREGAR CLIENTE
        // ==================================================

        contenedor.appendChild(
            tarjetaCliente
        );

    });

}

// ======================================================
// MARCAR CHECK
// ======================================================

async function marcarCheck(id, estado) {

    try {

        await refEnvios
            .child(id)
            .update({
                check: estado
            });

        console.log(
            "CHECK GUARDADO:",
            id,
            estado
        );

    } catch (error) {

        console.error(
            "ERROR GUARDANDO CHECK:",
            error
        );

    }

}


// ======================================================
// GUARDAR FECHA
// ======================================================

async function guardarFecha(id, fecha) {

    try {

        await refEnvios
            .child(id)
            .update({
                fechaEnvio: fecha
            });

        console.log(
            "FECHA GUARDADA:",
            id,
            fecha
        );

    } catch (error) {

        console.error(
            "ERROR GUARDANDO FECHA:",
            error
        );

    }

}


// ======================================================
// MARCAR COMO ENVIADO
// ======================================================

async function marcarEnviado(id) {

    const hoy =
        new Date()
            .toISOString()
            .split("T")[0];

    try {

        await refEnvios
            .child(id)
            .update({
                fechaEnvio: hoy
            });

        console.log(
            "ENVÍO GUARDADO:",
            id,
            hoy
        );

    } catch (error) {

        console.error(
            "ERROR GUARDANDO ENVÍO:",
            error
        );

    }

}


// ======================================================
// OCULTAR ENVÍO
// ======================================================

async function ocultarEnvio(id) {

    try {

        await refEnvios
            .child(id)
            .update({
                oculto: true
            });

        console.log(
            "ENVÍO OCULTADO:",
            id
        );

    } catch (error) {

        console.error(
            "ERROR OCULTANDO ENVÍO:",
            error
        );

    }

}

</script>

</body>
</html>
