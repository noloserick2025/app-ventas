  <style>
   
    nav {
      background: #333;
      color: white;
      padding: 10px;
    }
    nav a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }

    /* Layout: formulario a la izquierda, inventario columna derecha */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px; 
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .formulario {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
      background: #32CD32;
      padding: 15px;
      border-radius: 8px;
    }
    .formulario > div {
      width: 100%;
    }

    label, input, select, button, textarea {
      font-size: 16px;
    }
    input, select, button, textarea {
      margin-bottom: 10px;
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
      background-color: #007bff;
      color: white;
      transition: background-color 0.3s;
    }
    button:hover { background-color:#0056b3; }

    .reporte {
      margin-top: 20px;
    }

    .cliente-reporte {
      background: cyan;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    .cliente-header {
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
    }
    .cliente-info { font-weight:bold; font-size:14px; }
    .fecha-venta { font-size:16px; font-weight:bold; color:#555; margin-top:5px; }

    .productos-container { margin-top:10px; }
    .producto {
      display: grid;
      grid-template-columns: auto 1fr 2fr 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 6px 0;
      border: 2px solid #ddd;
      border-radius: 6px;
    }
    .producto.embalado { background-color: #FF8000; }

    .controles-cliente { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }

    .boton-wsp {
      background-color:#25d366; color:white; border:none; border-radius:5px; padding:10px; cursor:pointer;
    }
    .boton-wsp:hover { background-color:#128c7e; }

    .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999; }
    .modal-content { background:white; padding:20px; border-radius:8px; width:360px; box-sizing:border-box; }
    .modal-close { background:#dc3545; color:white; border:none; padding:8px 10px; border-radius:6px; cursor:pointer; }

    #tarjetasOcultas { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    #tarjetasOcultas button { width:100%; padding:8px 12px; font-size:0.95rem; border:none; border-radius:5px; background:#6c757d; color:white; cursor:pointer; }

    /* Inventario panel (derecha) */
    .inventario-panel { padding: 12px; }
    #lista-inventario .producto-inventario { display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #ddd; font-size:16px; }
    #lista-inventario .producto-inventario:nth-child(even){ background:#f1f1f1; }

    /* Responsivo: en pantallas pequeñas, inventario debajo */
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* helper discreto (leyendas del modal) */
    .leyenda-modal { font-size:12px; color:#666; margin-top:-6px; margin-bottom:10px; }

    /* forzado a mayúsculas en campos de texto */
    input[type="text"], textarea { text-transform: uppercase; }

#estado-conexion {
  width: 100%;
  padding: 8px;
  text-align: center;
  font-weight: bold;
  color: black;
  background: #f9d342; /* amarillo por defecto */
}

  </style>
</head>

        <button onclick="imprimirEtiquetasClientes()" style="padding:5px 10px; font-size:13px; background-color:#007bff; color:white; border:none; border-radius:4px; height:34px;">🖨️ Etiquetas</button>
        <button onclick="descargarVentas()" style="padding:6px 12px; background-color:green; color:white; border-radius:6px; border:none;">📥 Descargar ventas</button>

        <label for="inputArchivoJson" style="display:inline-block; padding:6px 12px; background-color:#007bff; color:white; border-radius:6px; cursor:pointer; font-weight:bold;">

  <script>

if (window.db) {
    window.db.ref("inventario").on("value", snap => {
        const data = snap.val() || {};

        // Convertir a array y agregar firebaseId
        window.inventario = Object.keys(data).map(id => ({
            ...data[id],
            firebaseId: id
        }));

        localStorage.setItem("inventario", JSON.stringify(window.inventario));

        if (typeof renderInventarioUI === "function") {
            renderInventarioUI();
        }
    });
}



if (window.db) {
    console.log("🔄 Activando listener en tiempo real");

    window.db.ref("ventas").on("value", snap => {
        const data = snap.val() || {};

        const nuevas = Object.keys(data).map(id => ({
            ...data[id],
            firebaseId: id,
            uuid: id
        }));

        const antes = JSON.stringify(window.ventas || []);
        const ahora = JSON.stringify(nuevas);

        if (antes !== ahora) {
            console.log("📡 Actualización detectada, refrescando UI");
            window.ventas = nuevas;
            localStorage.setItem("ventas", JSON.stringify(window.ventas));
            if (typeof mostrarVentas === "function") mostrarVentas();
        }
    });
}


if (window.db) {
    window.db.ref("ventas").on("child_added", snap => {
        const data = snap.val();
        const id = snap.key;

        // Evitar duplicados
        if (window.ventas.some(v => v.firebaseId === id)) return;

        const venta = {
            uuid: id,
            firebaseId: id,
            cliente: data.cliente,
            producto: data.producto,
            codigo: data.codigo,
            valor: Number(data.valor),
            cantidad: Number(data.cantidad) || 1,
            fecha: data.fecha,
            estado: data.estado || "Pendiente",
            idInventario: data.idInventario || null,
            embalado: !!data.embalado,
            timestamp: data.timestamp || Date.now()
        };

        window.ventas.push(venta);
        localStorage.setItem("ventas", JSON.stringify(window.ventas));

        if (typeof mostrarVentas === "function") mostrarVentas();
    });

    //

  if (window.db) {
    window.db.ref("estadoTarjetas").on("value", snap => {
        window.estadoClientesPrincipal = snap.val() || {};

        // Volver a pintar ventas para que se oculten en todos los dispositivos
        if (typeof mostrarVentas === "function") {
            mostrarVentas();
        }
    });
}


if (window.db) {
    window.db.ref("estadoTarjetas").on("value", snap => {
        window.estadoClientesPrincipal = snap.val() || {};

        if (typeof mostrarVentas === "function") {
            mostrarVentas();
        }
    });
}

 let ventaEditandoUUID = null;

console.log("Inicializando sistema…");

async function cargarInicial() {
    console.log("📥 Cargando datos iniciales…");

    if (!window.db) {
        console.error("Firebase no está inicializado");
        return;
    }

    await actualizarDatos();

    if (typeof mostrarVentas === "function") mostrarVentas();

    console.log("✔ Datos iniciales cargados");
}

cargarInicial();


    
  window.estadoClientesPrincipal = JSON.parse(localStorage.getItem('estadoClientesPrincipal') || '{}');
  window.clientes = JSON.parse(localStorage.getItem('clientes') || '[]');
  window.ventas = JSON.parse(localStorage.getItem('ventas') || '[]');
  window.inventario = JSON.parse(localStorage.getItem('inventario') || '[]');
  window.ventasPendientes = JSON.parse(localStorage.getItem('ventasPendientes') || '[]');

  let productoAEditar = null;

    async function ocultarTarjetaEnFirebase(cliente, fecha) {
    if (!window.db) return;

    const clave = `principal_${cliente}_${fecha}`;

    try {
        await window.db.ref("estadoTarjetas").child(clave).set({
            oculto: true
        });
    } catch (err) {
        console.error("Error guardando ocultación:", err);
    }
}


async function mostrarTarjetaEnFirebase(cliente, fecha) {
    if (!window.db) return;

    const clave = `principal_${cliente}_${fecha}`;

    try {
        await window.db.ref("estadoTarjetas").child(clave).remove();
    } catch (err) {
        console.error("Error mostrando tarjeta:", err);
    }
}

  
  function guardarDatosLocal() {
    try {
        localStorage.setItem("ventas", JSON.stringify(window.ventas));
        localStorage.setItem("clientes", JSON.stringify(window.clientes));
        localStorage.setItem("inventario", JSON.stringify(window.inventario));
        localStorage.setItem("ventasPendientes", JSON.stringify(window.ventasPendientes));

        // Evita errores si los labels NO existen
        const lblTotalMes = document.getElementById("totalMes");
        const lblPendiente = document.getElementById("pendientePago");
        const lblPagado = document.getElementById("pagadoRango");

        if (lblTotalMes) lblTotalMes.textContent = window.totalMesActual ?? "0";
        if (lblPendiente) lblPendiente.textContent = window.pendienteDePago ?? "0";
        if (lblPagado) lblPagado.textContent = window.pagadoEnRango ?? "0";

    } catch (e) {
        console.error("Error en guardarDatosLocal():", e);
    }
}


  function actualizarFechaHora() {
    const ahora = new Date();
    const opciones = { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false };
    document.getElementById('fechaHoraActual').textContent = ahora.toLocaleString('es-CL', opciones).replace(',', '');
  }
  setInterval(actualizarFechaHora, 1000);
  

  function moverFoco(event, siguienteId) {
    if (event.key === 'Enter') {
      event.preventDefault();
      const el = document.getElementById(siguienteId);
      if (el) el.focus();
    }
  }


  function moverFocoId(event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      const productoInput = document.getElementById('venta-producto');
      if (productoInput.readOnly) {
        document.getElementById('venta-cantidad').focus();
      } else {
        productoInput.focus();
      }
    }
  }

 
  function obtenerCodigoCorrelativo() {
    let ultimoCodigo = parseInt(localStorage.getItem("ultimoCodigo") || "0");
    let nuevoCodigo = ultimoCodigo + 1;
    if (nuevoCodigo > 99) nuevoCodigo = 1;
    localStorage.setItem("ultimoCodigo", nuevoCodigo);
    return String(nuevoCodigo).padStart(2, '0');
  }
  

function actualizarDatalist() {
    // 🟢 CORRECCIÓN CRÍTICA: Ahora busca 'clientes' (el ID de tu datalist)
    const datalist = document.getElementById('clientes'); 
    
    // El select de la gestión de clientes sigue siendo 'cliente-eliminar'
    const selectEliminar = document.getElementById('cliente-eliminar');
    
    // 🧹 Limpiar y preparar
    if (datalist) datalist.innerHTML = '';
    if (selectEliminar) {
        selectEliminar.innerHTML = '<option value="">Seleccionar cliente</option>'; 
    }

    // 🔄 Llenar ambas listas
    window.clientes.sort().forEach(cliente => {
        // Opción para Datalist (autocompletado en el formulario de venta)
        if (datalist) {
            const optionDatalist = document.createElement('option');
            optionDatalist.value = cliente;
            datalist.appendChild(optionDatalist);
        }
        
        // Opción para Select (eliminar/editar en gestión)
        if (selectEliminar) {
            const optionSelect = document.createElement('option');
            optionSelect.value = cliente;
            optionSelect.textContent = cliente;
            selectEliminar.appendChild(optionSelect);
        }
    });
}


function agregarCliente() {
    const input = document.getElementById('cliente-nombre');
    const nuevo = input.value.trim().toUpperCase();

    if (!nuevo) {
        return alert('Por favor, ingrese un nombre de cliente.');
    }

    if (window.clientes.includes(nuevo)) {
        return alert(`El cliente "${nuevo}" ya existe.`);
    }

    // 1. Añadir y guardar
    window.clientes.push(nuevo);
    guardarDatosLocal();
    
    // 2. Actualizar vistas
    actualizarDatalist();
    input.value = '';
    alert(`Cliente "${nuevo}" guardado con éxito.`);
}


function guardarClienteConEnter(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); 
        agregarCliente();
    }
}

function editarCliente() {
    const select = document.getElementById('cliente-eliminar');
    const inputNuevoNombre = document.getElementById('cliente-nuevo-nombre');
    
    const nombreActual = select.value.trim().toUpperCase();
    const nuevo = inputNuevoNombre.value.trim().toUpperCase();

    if (!nombreActual) {
        return alert('Primero, seleccione el cliente a editar de la lista desplegable.');
    }

    if (!nuevo) {
        return alert('Ingrese el nuevo nombre para el cliente.');
    }
    
    if (nuevo === nombreActual) {
         return alert('El nuevo nombre es el mismo que el actual.');
    }

    if (window.clientes.includes(nuevo)) {
        return alert(`El nombre "${nuevo}" ya existe en la lista de clientes.`);
    }

    // 1. Actualizar el cliente en la lista principal
    const clienteIndex = window.clientes.findIndex(c => c === nombreActual);
    if (clienteIndex > -1) {
        window.clientes[clienteIndex] = nuevo;
    } else {
        return alert('Error: Cliente no encontrado.');
    }


    // 2. Actualizar todas las ventas históricas asociadas
    window.ventas.forEach(v => {
        if (v.cliente === nombreActual) {
            v.cliente = nuevo;
        }
    });

    // 3. Guardar, actualizar y limpiar
    guardarDatosLocal();
    actualizarDatalist(); // Refresca las listas de clientes
    mostrarVentas(); // Refresca las tarjetas de venta con el nuevo nombre
    select.value = '';
    inputNuevoNombre.value = '';

    alert(`Cliente "${nombreActual}" actualizado a "${nuevo}" con éxito. Las ventas históricas también fueron actualizadas.`);
}

async function eliminarCliente() {
    const select = document.getElementById('cliente-eliminar');
    const clienteAEliminar = select.value.trim().toUpperCase();

    if (!clienteAEliminar) {
        return alert('Seleccione un cliente a eliminar de la lista desplegable.');
    }

    const ventasDelCliente = window.ventas.filter(v => v.cliente === clienteAEliminar);

    let mensajeConfirmacion = `¿Está seguro de que desea eliminar al cliente "${clienteAEliminar}"?`;
    if (ventasDelCliente.length > 0) {
        mensajeConfirmacion = `El cliente "${clienteAEliminar}" tiene ${ventasDelCliente.length} ventas registradas. ¿Está seguro de que desea eliminar al cliente y TODAS sus ventas históricas (local y en Firebase)?`;
    } 

    if (!confirm(mensajeConfirmacion)) return;

    // 1. Eliminar las ventas asociadas en Firebase (si es posible)
    if (ventasDelCliente.length > 0 && window.db && navigator.onLine) {
        for (let v of ventasDelCliente) {
            if (v.firebaseId) {
                await window.db.ref('ventas').child(v.firebaseId).remove()
                    .catch(e => console.error("Advertencia: Error eliminando venta en Firebase:", e));
            }
        }
    }

    // 2. Eliminar el cliente del arreglo y las ventas locales
    window.ventas = window.ventas.filter(v => v.cliente !== clienteAEliminar);
    window.clientes = window.clientes.filter(c => c !== clienteAEliminar);

    // 3. Guardar, actualizar y limpiar
    guardarDatosLocal();
    actualizarDatalist(); 
    mostrarVentas(); 
    select.value = ''; 

    alert(`Cliente "${clienteAEliminar}" y sus ventas históricas han sido eliminados.`);
}



function autocompletarVentaPorId() {
    const id = document.getElementById('venta-id').value.trim().toUpperCase();
    const productoInput = document.getElementById('venta-producto');
    const stockSpan = document.getElementById('stock-disponible');
    if (!id) {
      productoInput.readOnly = false;
      stockSpan.textContent = '0';
      return;
    }
    const invent = window.inventario || [];
    // CRÍTICO: Se completa la condición de búsqueda
    const encontrado = invent.find(p => String(p.id).toUpperCase() === id || (p.codigo && String(p.codigo).toUpperCase() === id));
    
    if (encontrado) {
      productoInput.value = encontrado.nombre || '';
      productoInput.readOnly = true;
      stockSpan.textContent = encontrado.cantidad || 0;
    } else {
      productoInput.readOnly = false;
      stockSpan.textContent = '0';
    }
  }
 

function renderInventarioUI() {
    const lista = document.getElementById('lista-inventario');

async function registrarVenta() { 
    const clienteInput = document.getElementById('venta-cliente');
    const cliente = clienteInput.value.trim();
    if (!window.clientes.includes(cliente)) {
        alert("Solo se pueden registrar ventas a clientes guardados.");
        return;
    }

    // 1. Obtener el código correlativo único
    const correlativoTransaccion = obtenerCodigoCorrelativo();

    // 2. ID de inventario
    const codigoInventario = document.getElementById('venta-id').value.trim();

    const productoInput = document.getElementById('venta-producto');
    const producto = productoInput.value.trim();
    const valorIngresado = parseFloat(document.getElementById('venta-valor').value);
    const cantidad = parseInt(document.getElementById('venta-cantidad').value) || 1;

    const fechaManual = document.getElementById("fechaManual").value;
    const fecha = fechaManual ? fechaManual : new Date().toLocaleDateString('sv-SE');
    const ahora = new Date();
    const hora = ahora.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

    if (isNaN(valorIngresado) || valorIngresado <= 0 || !producto) {
        alert("Ingrese un valor y producto válidos.");
        return;
    }

    // 🔥 VALOR UNITARIO REAL
    const valorUnitario = valorIngresado;

    // -------------------------
    //   3. AJUSTAR INVENTARIO
    // -------------------------
    if (codigoInventario) {
        const idInv = codigoInventario.toUpperCase();
        const prodLocal = window.inventario.find(p => String(p.codigo).toUpperCase() === idInv);

        if (!prodLocal) {
            alert(`Producto con ID/Código ${idInv} no se encuentra en inventario.`);
            return;
        }

        if ((prodLocal.cantidad || 0) < cantidad) {
            alert(`STOCK INSUFICIENTE: Solo quedan ${prodLocal.cantidad || 0} unidades.`);
            return;
        }

        // Descuento en Firebase
        if (window.db && navigator.onLine) {
            try {
                const ref = window.db.ref('inventario').child(prodLocal.firebaseId || idInv).child('cantidad');
                const result = await ref.transaction(current => {
                    const actual = parseInt(current || 0);
                    const nuevo = actual - cantidad;
                    if (nuevo < 0) return; 
                    return nuevo;
                });

                if (result.committed) {
                    prodLocal.cantidad = result.snapshot.val();
                }

            } catch(err) {
                console.warn("Error ajustando inventario:", err);
            }
        } else {
            prodLocal.cantidad = Math.max(0, (prodLocal.cantidad || 0) - cantidad);
        }

        localStorage.setItem("inventario", JSON.stringify(window.inventario));
        if (typeof renderInventarioUI === "function") renderInventarioUI();
    }

    // ---------------------------------
    //   🔥🔥 4. REGISTRAR UNA SOLA VENTA 🔥🔥
    // ---------------------------------
    let nuevaVenta = {
        uuid: self.crypto.randomUUID(),
        correlativo: correlativoTransaccion,
        cliente: cliente,
        codigo: codigoInventario,
        producto: producto,
        cantidad: cantidad,
        valor: valorUnitario,
        fecha: fecha,
        hora: hora,
        embalado: false,
        firebaseId: null,
        pendienteSincronizar: !!window.db
    };

    // Subida a Firebase
    if (window.db && navigator.onLine) {
        try {
            const ventaFB = { ...nuevaVenta };
            delete ventaFB.uuid;
            delete ventaFB.pendienteSincronizar;

            const newRef = await window.db.ref('ventas').push(ventaFB);
            nuevaVenta.firebaseId = newRef.key;
            nuevaVenta.pendienteSincronizar = false;

        } catch(error) {
            console.warn("Error subiendo venta:", error);
            nuevaVenta.pendienteSincronizar = true;
            window.ventasPendientes.push(nuevaVenta);
        }
    } else {
        nuevaVenta.pendienteSincronizar = true;
        window.ventasPendientes.push(nuevaVenta);
    }

    // Guardar local
    // Si Firebase está online, NO agregamos localmente.
// Firebase se encargará de disparar el onChildAdded.
if (!window.db || !navigator.onLine) {
    // Si Firebase está ONLINE, NO agregamos localmente.
// Firebase disparará onChildAdded y la cargará correctamente.
if (!window.db || !navigator.onLine) {
    window.ventas.push(nuevaVenta);
}

}

    guardarDatosLocal();

    // Actualizar UI
    mostrarVentas();

    // Etiqueta solo una vez
    if (typeof imprimirEtiquetaVenta === "function") {
        imprimirEtiquetaVenta(cliente, correlativoTransaccion, fecha);
    }
}

    const cantidadAnterior = productoAEditar.cantidad;
    const diferencia = nuevaCantidad - cantidadAnterior;

    // 1. Actualización de datos en el objeto
    productoAEditar.producto = nuevoProducto;
    productoAEditar.valor = nuevoValor;
    productoAEditar.cantidad = nuevaCantidad;

    // 2. Ajuste de Inventario si es necesario
    const idInv = productoAEditar.idInventario;
    if (idInv) {
      if (window.db && navigator.onLine) {
        try {
          const ref = window.db.ref('inventario').child(idInv).child('cantidad');
          await ref.transaction(actual => {
            if (actual === null) return 0;
            let nuevoStock = parseInt(actual || 0) - diferencia; // Diferencia ya es (+/-)
            if (nuevoStock < 0) {
              alert(`Stock insuficiente para el cambio. Stock actual: ${actual}`);
              throw new Error('Stock insuficiente');
            }
            return nuevoStock;
          });
        } catch(err) {
          console.error('Error ajustando inventario en Firebase:', err);
          productoAEditar.cantidad = cantidadAnterior; // Revertir la edición local en caso de fallo sobre stock
          alert('No se pudo ajustar el inventario. Cambios revertidos.');
          cerrarModalEditar();
          return;
        }
      } else {
        // offline: ajustar local
        const idx = window.inventario.findIndex(p => String(p.id).toUpperCase() === String(idInv).toUpperCase());
        if (idx > -1) {
          window.inventario[idx].cantidad = (parseInt(window.inventario[idx].cantidad || 0) - diferencia);
          if (window.inventario[idx].cantidad < 0) window.inventario[idx].cantidad = 0;
        }
      }
    }

    // 3. Actualización en Firebase y local
    if (window.db && productoAEditar.firebaseId) {
        const ventaActualizada = { ...productoAEditar };
        delete ventaActualizada.uuid; 
        delete ventaActualizada.firebaseId; 

        await window.db.ref('ventas').child(productoAEditar.firebaseId).set(ventaActualizada)
            .catch(err => console.error("Error actualizando venta en Firebase:", err));
    }
    
    // 4. Fallback/Guardado local
    const idx = window.ventas.findIndex(v => v.uuid === productoAEditar.uuid);
    if (idx > -1) window.ventas[idx] = productoAEditar;

    guardarDatosLocal();
    cerrarModalEditar();
    mostrarVentas();
  } 

  async function eliminarProducto(ventaObj) {
    if (!confirm(`¿Eliminar la línea de producto "${ventaObj.producto}"?`)) return; 
    
    // 1. Devolver stock (si aplica)
    const idInv = ventaObj.idInventario;
    const cantidad = ventaObj.cantidad;
    if (idInv && cantidad > 0) {
        if (window.db && navigator.onLine) {
             try {
                const ref = window.db.ref('inventario').child(idInv).child('cantidad');
                await ref.transaction(current => {
                    return (current || 0) + cantidad;
                });
            } catch(err) {
                console.error('Error al devolver stock en Firebase:', err);
            }
        } else {
             // offline: devolver local
            const idx = window.inventario.findIndex(p => String(p.id).toUpperCase() === String(idInv).toUpperCase());
            if (idx > -1) {
                window.inventario[idx].cantidad = (parseInt(window.inventario[idx].cantidad || 0) + cantidad);
            }
        }
    }

    // 2. Eliminación en Firebase
    if (window.db && ventaObj.firebaseId) { 
        await window.db.ref('ventas').child(ventaObj.firebaseId).remove() 
          .catch(err => console.error("Error eliminando venta en Firebase:", err)); 
    } 
    
    // 3. Eliminación local
    window.ventas = window.ventas.filter(v => v.uuid !== ventaObj.uuid); 
    
    // 4. Guardar y actualizar vista
    guardarDatosLocal(); 
    mostrarVentas(); 
  }
  window.addEventListener('DOMContentLoaded', () => {
    actualizarFechaHora(); // Tu llamada a la función
    actualizarDatalist(); 
    actualizarDatos(); // CRÍTICO: Carga las ventas (y llamará a mostrarVentas)
    
    // Auto-sync periódica (intentar subir pendientes cada 10s)
    setInterval(()=> {
      if (navigator.onLine) sincronizarVentasFirebase();
    }, 10000);
  });



function actualizarBarraConexion() {
    const barra = document.getElementById("estado-conexion");
    if (!barra) return;

    if (navigator.onLine) {
        barra.style.background = "#7CFC00"; 
        barra.style.color = "black";
        barra.textContent = "CONECTADO – EN LÍNEA";
    } else {
        barra.style.background = "#f9d342"; 
        barra.style.color = "black";
        barra.textContent = "SIN CONEXIÓN – TRABAJANDO OFFLINE";
    }
}

window.addEventListener("online", actualizarBarraConexion);
window.addEventListener("offline", actualizarBarraConexion);

document.addEventListener("DOMContentLoaded", () => {
    actualizarBarraConexion();
});
</script>
