// Al inicializar tu app
window.ventas = window.ventas || [];
window.ventasPendientes = window.ventasPendientes || [];

if (window.db) {
  window.db.ref('ventas').on('child_added', snapshot => {
    const data = snapshot.val();
    const firebaseId = snapshot.key;

    // Buscar por firebaseId primero
    const existePorFirebase = window.ventas.find(v => v.firebaseId === firebaseId);
    if (existePorFirebase) return;

    // A veces la venta local tiene uuid pero no firebaseId -> evitar duplicar
    if (data.uuid) {
      const existePorUuid = window.ventas.find(v => v.uuid === data.uuid);
      if (existePorUuid) {
        // Actualizar el objeto local con firebaseId para futuras comparaciones
        existePorUuid.firebaseId = firebaseId;
        existePorUuid.pendienteSincronizar = false;
        guardarDatosLocal();
        mostrarVentas();
        return;
      }
    }

    // Normal: agregar la venta traída desde Firebase
    const venta = {
      uuid: data.uuid || self.crypto.randomUUID(),
      firebaseId: firebaseId,
      correlativo: data.correlativo,
      cliente: data.cliente,
      codigo: data.codigo,
      producto: data.producto,
      cantidad: data.cantidad,
      valor: data.valor,
      fecha: data.fecha,
      hora: data.hora,
      embalado: !!data.embalado,
      pendienteSincronizar: false
    };

    window.ventas.push(venta);
    guardarDatosLocal();
    mostrarVentas();
  });
}

    try {
        await window.db.ref("estadoTarjetas")
            .child(`principal_${cliente}_${fecha}`)
            .set({ oculto: true });
    } catch (err) {
        console.error("Error ocultando tarjeta:", err);
    }

    if (!window.db) return;

    try {
        await window.db.ref("estadoTarjetas")
            .child(`principal_${cliente}_${fecha}`)
            .remove();

async function obtenerCodigoCorrelativo() {
  // Intentar obtener y aumentar correlativo atómico en Firebase
  try {
    if (window.db && navigator.onLine) {
      const ref = window.db.ref('contadores').child('correlativoVentas');
      const result = await ref.transaction(current => {
        const actual = parseInt(current || 0, 10);
        return actual + 1;
      });

      if (result && result.committed) {
        return String(result.snapshot.val()).padStart(6, '0'); // formato opcional
      }
    }
  } catch (err) {
    console.warn("No se pudo usar contador Firebase:", err);
  }

  // Fallback local
  const clave = 'correlativoVentas_local';
  let local = parseInt(localStorage.getItem(clave) || '0', 10);
  local = local + 1;
  localStorage.setItem(clave, String(local));
  return String(local).padStart(6, '0');
}

async function agregarCliente() {
    const input = document.getElementById("cliente-nombre");
    const nuevo = input.value.trim().toUpperCase();

    if (!nuevo) return alert("Nombre vacío.");

    // Evita duplicados
    if (window.clientes.includes(nuevo)) {
        alert("Ese cliente ya existe.");
        return;
    }

    // Agregar local
    window.clientes.push(nuevo);
    guardarDatosLocal();
    actualizarDatalist();

    // 🔥 Guardar también en Firebase para que aparezca en TODOS los dispositivos
    try {
        await window.db.ref("clientes/" + nuevo).set(nuevo);
    } catch (e) {
        console.error("Error subiendo cliente a Firebase:", e);
    }

    input.value = "";
    alert(`Cliente "${nuevo}" guardado correctamente.`);
}

// 🔥 EDITAR CLIENTE

function editarCliente() {
    const select = document.getElementById('cliente-eliminar');
    const nuevo = document.getElementById('cliente-nuevo-nombre').value.trim().toUpperCase();
    const actual = select.value.trim().toUpperCase();

    if (!actual) return alert("Selecciona cliente.");
    if (!nuevo) return alert("Nuevo nombre vacío.");
    if (window.clientes.includes(nuevo)) return alert("Ese nombre ya existe.");

    window.clientes = window.clientes.map(c => c === actual ? nuevo : c);
    window.ventas.forEach(v => { if (v.cliente === actual) v.cliente = nuevo });

    guardarDatosLocal();
    actualizarDatalist();
    mostrarVentas();

    alert(`Cliente actualizado a "${nuevo}".`);
}

    if (!confirm(`Eliminar "${cliente}" y sus ${ventasCliente.length} ventas?`)) return;

async function registrarVenta() {
  // Validaciones básicas
  const cliente = document.getElementById('venta-cliente').value.trim();
  if (!window.clientes.includes(cliente)) { alert("Solo clientes guardados."); return; }

  const codigoInventario = document.getElementById('venta-id').value.trim();
  const producto = document.getElementById('venta-producto').value.trim();
  const valorUnitario = parseFloat(document.getElementById('venta-valor').value);
  const cantidad = parseInt(document.getElementById('venta-cantidad').value) || 1;
  if (!producto || isNaN(valorUnitario) || valorUnitario <= 0) { alert("Producto/valor inválido."); return; }

  const fechaManual = document.getElementById("fechaManual").value;
  const fecha = fechaManual ? fechaManual : new Date().toLocaleDateString('sv-SE');
  const hora = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

  // Obtener correlativo (asegura persistencia)
  const correlativo = await obtenerCodigoCorrelativo();

  // Crear objeto base
  const ventaLocal = {
    uuid: self.crypto.randomUUID(),
    correlativo,
    cliente,
    codigo: codigoInventario,
    producto,
    cantidad,
    valor: valorUnitario,
    fecha,
    hora,
    embalado: false,
    firebaseId: null,
    pendienteSincronizar: false
  };

  // Ajuste de inventario local y remoto (mismo enfoque que antes, verificar stock)
  if (codigoInventario) {
    const prodLocal = window.inventario.find(p => String(p.codigo).toUpperCase() === String(codigoInventario).toUpperCase());
    if (!prodLocal) { alert("Producto no existe en inventario."); return; }
    if ((prodLocal.cantidad || 0) < cantidad) { alert(`Stock insuficiente: ${prodLocal.cantidad || 0}`); return; }

    try {
      if (window.db && navigator.onLine) {
        const refCant = window.db.ref('inventario').child(prodLocal.firebaseId).child('cantidad');
        const result = await refCant.transaction(actual => {
          actual = parseInt(actual || 0);
          const nuevo = actual - cantidad;
          if (nuevo < 0) return;
          return nuevo;
        });
        if (result.committed) prodLocal.cantidad = result.snapshot.val();
      } else {
        prodLocal.cantidad = Math.max(0, (prodLocal.cantidad || 0) - cantidad);
      }
      localStorage.setItem("inventario", JSON.stringify(window.inventario));
      if (typeof renderInventarioUI === "function") renderInventarioUI();
    } catch (err) {
      console.warn("Error actualizando inventario:", err);
    }
  }

  // SUBIR A FIREBASE — intentar primero y sólo push si online
  if (window.db && navigator.onLine) {
    try {
      const ventaFB = { ...ventaLocal };
      delete ventaFB.uuid;
      delete ventaFB.pendienteSincronizar;

      const ref = await window.db.ref('ventas').push(ventaFB);
      ventaLocal.firebaseId = ref.key;
      ventaLocal.pendienteSincronizar = false;

      // Guardar local (con firebaseId para que no duplique con onChildAdded)
      window.ventas.push(ventaLocal);

    } catch (err) {
      console.warn("Error push venta:", err);
      ventaLocal.pendienteSincronizar = true;
      window.ventasPendientes.push(ventaLocal);
      window.ventas.push(ventaLocal);
    }
  } else {
    ventaLocal.pendienteSincronizar = true;
    window.ventasPendientes.push(ventaLocal);
    window.ventas.push(ventaLocal);
  }

  guardarDatosLocal();
  mostrarVentas();

  if (typeof imprimirEtiquetaVenta === "function") imprimirEtiquetaVenta(cliente, correlativo, fecha);
}

async function editarVenta(uuidOrFirebaseId, cambios) {
  // encontrar venta (por firebaseId o uuid)
  const idx = window.ventas.findIndex(v => v.firebaseId === uuidOrFirebaseId || v.uuid === uuidOrFirebaseId);
  if (idx === -1) { alert("Venta no encontrada"); return; }

  const original = window.ventas[idx];
  const copia = { ...original, ...cambios };

  // Validaciones básicas
  if (!copia.producto || isNaN(copia.valor) || copia.valor <= 0) { alert("Datos inválidos"); return; }
  if (!Number.isInteger(parseInt(copia.cantidad))) { alert("Cantidad inválida"); return; }

  // Ajuste de inventario: si cambia cantidad y hay codigo, revertir diferencia
  try {
    if (original.codigo) {
      const prodLocal = window.inventario.find(p => String(p.codigo).toUpperCase() === String(original.codigo).toUpperCase());
      if (prodLocal) {
        const diff = parseInt(copia.cantidad) - parseInt(original.cantidad || 0);
        // Si diff > 0: necesitamos descontar más stock. Si diff < 0: devolver stock.
        if (window.db && navigator.onLine && prodLocal.firebaseId) {
          const refCant = window.db.ref('inventario').child(prodLocal.firebaseId).child('cantidad');
          await refCant.transaction(actual => {
            actual = parseInt(actual || 0);
            const nuevo = actual - diff;
            if (nuevo < 0) return; // no permitimos llevar a negativo
            return nuevo;
          });
          // actualizar local
          prodLocal.cantidad = Math.max(0, (prodLocal.cantidad || 0) - diff);
        } else {
          prodLocal.cantidad = Math.max(0, (prodLocal.cantidad || 0) - diff);
        }
      }
    }
  } catch (err) {
    console.warn("Error ajustando inventario al editar:", err);
  }

  // Actualizar en Firebase
  try {
    if (window.db && navigator.onLine && original.firebaseId) {
      const up = { ...copia };
      delete up.uuid;
      delete up.firebaseId;
      delete up.pendienteSincronizar;
      await window.db.ref('ventas').child(original.firebaseId).update(up);
      copia.pendienteSincronizar = false;
    } else {
      copia.pendienteSincronizar = true;
    }
  } catch (err) {
    console.warn("Error actualizando venta en Firebase:", err);
    copia.pendienteSincronizar = true;
  }

  // Reemplazar localmente y guardar
  window.ventas[idx] = copia;
  guardarDatosLocal();
  mostrarVentas();
}

  async function guardarEdicion() {
    if (!productoAEditar) return;
    
    const nuevoProducto = document.getElementById('editar-producto').value.toUpperCase();
    const nuevoValor = parseFloat(document.getElementById('editar-valor').value);
    const nuevaCantidad = parseInt(document.getElementById('editar-cantidad').value);

    // Guarda los valores anteriores para el ajuste de inventario
    const cantidadAnterior = productoAEditar.cantidad;
    const diferencia = nuevaCantidad - cantidadAnterior;

    // 1. Actualización de datos en el objeto
    productoAEditar.producto = nuevoProducto;
    productoAEditar.valor = nuevoValor;
    productoAEditar.cantidad = nuevaCantidad;

    // 2. Ajuste de Inventario si es necesario
    const idInv = productoAEditar.idInventario;
    if (idInv) {
      if (window.db && navigator.onLine) {
        try {
          const ref = window.db.ref('inventario').child(idInv).child('cantidad');
          await ref.transaction(actual => {
            if (actual === null) return 0;
            let nuevoStock = parseInt(actual || 0) - diferencia; // Diferencia ya es (+/-)
            if (nuevoStock < 0) {
              alert(`Stock insuficiente para el cambio. Stock actual: ${actual}`);
              throw new Error('Stock insuficiente');
            }
            return nuevoStock;
          });
        } catch(err) {
          console.error('Error ajustando inventario en Firebase:', err);
          productoAEditar.cantidad = cantidadAnterior; // Revertir la edición local en caso de fallo sobre stock
          alert('No se pudo ajustar el inventario. Cambios revertidos.');
          cerrarModalEditar();
          return;
        }
      } else {
        // offline: ajustar local
        const idx = window.inventario.findIndex(p => String(p.id).toUpperCase() === String(idInv).toUpperCase());
        if (idx > -1) {
          window.inventario[idx].cantidad = (parseInt(window.inventario[idx].cantidad || 0) - diferencia);
          if (window.inventario[idx].cantidad < 0) window.inventario[idx].cantidad = 0;
        }
      }
    }

    // 3. Actualización en Firebase y local
    if (window.db && productoAEditar.firebaseId) {
        const ventaActualizada = { ...productoAEditar };
        delete ventaActualizada.uuid; 
        delete ventaActualizada.firebaseId; 

        await window.db.ref('ventas').child(productoAEditar.firebaseId).set(ventaActualizada)
            .catch(err => console.error("Error actualizando venta en Firebase:", err));
    }
    
    // 4. Fallback/Guardado local
    const idx = window.ventas.findIndex(v => v.uuid === productoAEditar.uuid);
    if (idx > -1) window.ventas[idx] = productoAEditar;

    guardarDatosLocal();
    cerrarModalEditar();
    mostrarVentas();
  } 

  async function eliminarProducto(ventaObj) {
    if (!confirm(`¿Eliminar la línea de producto "${ventaObj.producto}"?`)) return; 
    
    // 1. Devolver stock (si aplica)
    const idInv = ventaObj.idInventario;
    const cantidad = ventaObj.cantidad;
    if (idInv && cantidad > 0) {
        if (window.db && navigator.onLine) {
             try {
                const ref = window.db.ref('inventario').child(idInv).child('cantidad');
                await ref.transaction(current => {
                    return (current || 0) + cantidad;
                });
            } catch(err) {
                console.error('Error al devolver stock en Firebase:', err);
            }
        } else {
             // offline: devolver local
            const idx = window.inventario.findIndex(p => String(p.id).toUpperCase() === String(idInv).toUpperCase());
            if (idx > -1) {
                window.inventario[idx].cantidad = (parseInt(window.inventario[idx].cantidad || 0) + cantidad);
            }
        }
    }

    // 2. Eliminación en Firebase
    if (window.db && ventaObj.firebaseId) { 
        await window.db.ref('ventas').child(ventaObj.firebaseId).remove() 
          .catch(err => console.error("Error eliminando venta en Firebase:", err)); 
    } 
    
    // 3. Eliminación local
    window.ventas = window.ventas.filter(v => v.uuid !== ventaObj.uuid); 
    
    // 4. Guardar y actualizar vista
    guardarDatosLocal(); 
    mostrarVentas(); 
  }

    }, 10000);
  });

function renderInventarioUI() {
    const lista = document.getElementById('lista-inventario');
    lista.innerHTML = '';

    // Inventario cargado desde Firebase
    let inventarioValido = window.inventario || [];

    // 1️⃣ Ocultar productos con stock 0
    inventarioValido = inventarioValido.filter(p => Number(p.cantidad) > 0);

    // 2️⃣ Ordenar por código (numérico o alfanumérico)
    inventarioValido.sort((a, b) => {
        const codA = String(a.codigo).trim();
        const codB = String(b.codigo).trim();

        // Si ambos códigos son números → orden numérico real
        if (!isNaN(codA) && !isNaN(codB)) {
            return Number(codA) - Number(codB);
        }

        // Otros casos → orden natural
        return codA.localeCompare(codB, 'es', { numeric: true });
    });

    // 3️⃣ Renderizar inventario ordenado
    inventarioValido.forEach(producto => {
        const div = document.createElement('div');
        div.className = 'producto-inventario';

        const idText = producto.codigo ? `${producto.codigo} - ` : "";
        const nombreText = producto.nombre || "SIN NOMBRE";
        const stockText = producto.cantidad !== undefined ? ` (${producto.cantidad})` : "";

        // Contenedor principal del producto
div.innerHTML = `
    <span style="flex:1;">${idText}${nombreText}</span>
    <span style="font-weight:bold; color:#007bff; min-width:50px; text-align:right;">
        ${producto.cantidad}
    </span>
`;
lista.appendChild(div);

    });
}

 // ===================================================
// 🔥 GUARDAR VENTA CON SOPORTE OFFLINE
// ===================================================
function estaOnline() {
    return navigator.onLine;
}

async function guardarVentaEnFirebase(ventaObj) {
    if (estaOnline()) {
        try {
            const ref = window.db.ref("ventas").push();
            await ref.set(ventaObj);
            console.log("✔ Venta guardada en Firebase");
        } catch (e) {
            console.error("Error subiendo venta:", e);
            guardarVentaOffline(ventaObj);
        }
    } else {
        guardarVentaOffline(ventaObj);
    }
}

// ===================================================
// 🔥 GUARDAR VENTA LOCAL CUANDO NO HAY INTERNET
// ===================================================
function guardarVentaOffline(ventaObj) {
    let pendientes = JSON.parse(localStorage.getItem("pendientesSubir") || "[]");
    pendientes.push(ventaObj);
    localStorage.setItem("pendientesSubir", JSON.stringify(pendientes));
    console.log("📌 Venta guardada localmente (offline)");
}

// ===================================================
// 🔥 SUBIR AUTOMÁTICAMENTE CUANDO VUELVE INTERNET
// ===================================================
// ========== 🔄 SINCRONIZADOR AUTOMÁTICO ==========
setInterval(async () => {
    if (!navigator.onLine || !window.db) return;

    if (!window.ventasPendientes) window.ventasPendientes = [];

    if (window.ventasPendientes.length === 0) return;

    console.log("🔄 Intentando subir ventas pendientes...");

    const pend = [...window.ventasPendientes];
    window.ventasPendientes = [];

    for (let venta of pend) {
        try {
            const ventaFB = { ...venta };
            delete ventaFB.uuid;
            delete ventaFB.pendiente;

            const ref = await window.db.ref("ventas").push(ventaFB);
            venta.firebaseId = ref.key;

        } catch (e) {
            console.warn("Error sincronizando una venta:", e);
            venta.pendiente = true;
            window.ventasPendientes.push(venta);
        }
    }

    guardarDatosLocal();
}, 5000);



// ===============================
// 🔥 CARGA INICIAL + SINCRONIZACIÓN
// ===============================

document.addEventListener("DOMContentLoaded", () => {
    actualizarFechaHora();
    actualizarDatalist();
    actualizarDatos();

    // Auto-sync cada 10 segundos
    setInterval(() => {
        if (navigator.onLine) sincronizarVentasFirebase();
    }, 10000);
});
