function descargarVentas() {
  if (!window.ventas || window.ventas.length === 0) {
    alert('No hay ventas para respaldar');
    return;
  }

  const respaldo = {
    fechaRespaldo: new Date().toISOString(),
    totalVentas: window.ventas.length,
    ventas: window.ventas
  };

  const blob = new Blob(
    [JSON.stringify(respaldo, null, 2)],
    { type: 'application/json' }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `respaldo_ventas_${getFechaChile()}.json`;
  a.click();

  URL.revokeObjectURL(url);
}

function actualizarDatalist() {
    const datalist = document.getElementById('clientes');
    const selectEliminar = document.getElementById('cliente-eliminar');

    if (datalist) datalist.innerHTML = "";
    if (selectEliminar) {
        selectEliminar.innerHTML = '<option value="">Seleccionar cliente</option>';
    }

    if (!window.clientes) return;

    // Ordenar alfabéticamente para que sea fácil buscar
    const clientesOrdenados = [...window.clientes].sort((a, b) => a.localeCompare(b));

    clientesOrdenados.forEach(c => {
        if (c) {
            // Llenar el datalist para el input de ventas
            if (datalist) {
                const o = document.createElement("option");
                o.value = c;
                datalist.appendChild(o);
            }
            // Llenar el select para el panel de gestión
            if (selectEliminar) {
                const o = document.createElement("option");
                o.value = c;
                o.textContent = c;
                selectEliminar.appendChild(o);
            }
        }
    });
}

async function agregarCliente() {
    const input = document.getElementById("cliente-nombre");
    const nuevo = input.value.trim().toUpperCase();

    if (!nuevo) return alert("Nombre vacío.");

    // Evita duplicados
    if (window.clientes.includes(nuevo)) {
        alert("Ese cliente ya existe.");
        return;
    }

    // Agregar local
    window.clientes.push(nuevo);
    guardarDatosLocal();
    actualizarDatalist();

    // 🔥 Guardar también en Firebase para que aparezca en TODOS los dispositivos
    try {
        await window.db.ref("clientes/" + nuevo).set(nuevo);
    } catch (e) {
        console.error("Error subiendo cliente a Firebase:", e);
    }

    input.value = "";
    alert(`Cliente "${nuevo}" guardado correctamente.`);
}

function editarCliente() {
    const select = document.getElementById('cliente-eliminar');
    const nuevo = document.getElementById('cliente-nuevo-nombre').value.trim().toUpperCase();
    const actual = select.value.trim().toUpperCase();

    if (!actual) return alert("Selecciona cliente.");
    if (!nuevo) return alert("Nuevo nombre vacío.");
    if (window.clientes.includes(nuevo)) return alert("Ese nombre ya existe.");

    window.clientes = window.clientes.map(c => c === actual ? nuevo : c);
    window.ventas.forEach(v => { if (v.cliente === actual) v.cliente = nuevo });

    guardarDatosLocal();
    actualizarDatalist();
    mostrarVentas();

    alert(`Cliente actualizado a "${nuevo}".`);
}

async function eliminarCliente() {
    const select = document.getElementById("cliente-eliminar");
    const cliente = select.value.trim().toUpperCase();

    if (!cliente) return alert("Selecciona un cliente.");

    const ventasCliente = window.ventas.filter(v => v.cliente === cliente);

    if (!confirm(`Eliminar "${cliente}" y sus ${ventasCliente.length} ventas?`)) return;

    if (window.db && navigator.onLine) {
        for (let v of ventasCliente) {
            if (v.firebaseId) {
                await window.db.ref("ventas").child(v.firebaseId).remove().catch(()=>{});
            }
        }
    }

    window.ventas = window.ventas.filter(v => v.cliente !== cliente);
    window.clientes = window.clientes.filter(c => c !== cliente);

    guardarDatosLocal();
    actualizarDatalist();
    mostrarVentas();

    alert("Cliente eliminado.");
}

// 🔥 REPARA CLIENTES FALTANTES EN FIREBASE
// Detecta clientes que aparecen en ventas pero NO
// están en el listado de clientes
// ===============================================
async function repararClientesFaltantes() {
    const clientesDeVentas = [...new Set(ventas.map(v => v.cliente))].map(c => c.toUpperCase());

    // Si nunca cargaron los clientes aún
    if (!Array.isArray(window.clientes)) return;

    const clientesLocales = window.clientes.map(c => c.toUpperCase());

    // Buscar diferencias
    const faltantes = clientesDeVentas.filter(c => !clientesLocales.includes(c));

    if (faltantes.length === 0) return;

    for (let cliente of faltantes) {
        try {
            // Guardar en LOCAL
            window.clientes.push(cliente);
            guardarDatosLocal();

            // Guardar en Firebase
            await window.db.ref("clientes/" + cliente).set(cliente);
            console.log("Cliente reparado:", cliente);
        } catch (e) {
            console.error("Error reparando cliente:", cliente, e);
        }
    }

    actualizarDatalist();
}

async function registrarVenta() {
  const cliente = document.getElementById("venta-cliente").value.trim().toUpperCase();
  const idInventario = document.getElementById("venta-id").value.trim().toUpperCase();
  const producto = document.getElementById("venta-producto").value.trim().toUpperCase();
  const cantidad = parseInt(document.getElementById("venta-cantidad").value) || 1;
  const valorTotal = parseFloat(document.getElementById("venta-valor").value) || 0;

  if (!cliente || !producto || valorTotal <= 0) {
    alert("Completa cliente, producto y valor.");
    return;
  }

  // 🔴 1. VALIDACIÓN DE STOCK DISPONIBLE
  if (idInventario) {
    const itemInv = window.inventario.find(p => p.codigo === idInventario);
    if (itemInv) {
      if (cantidad > itemInv.cantidad) {
        alert(`❌ Cantidad insuficiente. Stock disponible: ${itemInv.cantidad}`);
        return; 
      }
    }
  }

  const fecha = document.getElementById('fechaManual')?.value || getFechaChile();

  // 🔢 2. CORRELATIVO (Se calcula antes de guardar)
  let correlativo = parseInt(localStorage.getItem("correlativo_actual") || "0") + 1;
  if (correlativo > 99) correlativo = 1;
  const correlativoTxt = correlativo.toString().padStart(2, "0");
  localStorage.setItem("correlativo_actual", correlativo);

  const nuevaVenta = {
    correlativo: correlativoTxt,
    cliente,
    producto,
    cantidad,
    valor: valorTotal,
    fecha,
    idInventario: idInventario || null,
    embalado: false,
    timestamp: Date.now()
  };

  // 💾 3. GUARDADO ÚNICO EN FIREBASE (Y DESCUENTO DE STOCK)
  if (navigator.onLine && window.db) {
    try {
      // Registrar la venta
      const refVenta = window.db.ref("ventas").push();
      await refVenta.set(nuevaVenta);

      // Descontar del inventario en Firebase si hay ID
      if (idInventario) {
        const refInv = window.db.ref("inventario");
        const snap = await refInv.orderByChild("codigo").equalTo(idInventario).once("value");
        if (snap.exists()) {
          const keyInFirebase = Object.keys(snap.val())[0];
          await refInv.child(keyInFirebase).child("cantidad").transaction((actual) => {
            return (actual || 0) - cantidad;
          });
        }
      }
      console.log("Venta e inventario sincronizados");
    } catch (e) {
      console.error("Error al sincronizar:", e);
    }
  } else {
    // Si estás offline, lo guarda local para subirlo luego
    window.ventas.push({ ...nuevaVenta, uuid: crypto.randomUUID(), pendiente: true });
    guardarDatosLocal();
  }

  // 🖨️ 4. ACCIONES FINALES
  imprimirEtiquetaVenta(cliente, correlativoTxt, fecha);
  limpiarCamposDespuesVenta();
  
  // No necesitamos llamar a mostrarVentas() manualmente aquí porque 
  // el listener 'on("value")' de tu código ya lo hará al detectar el cambio en Firebase.
renderInventarioUI(); 
}

 async function guardarEdicion() {

                    if (snap.exists()) {
                        const key = Object.keys(snap.val())[0];
                        await refInv.child(key).update({ cantidad: itemInv.cantidad });
                    }
                }
            }
        }

        // 2. Actualizar Venta en Firebase
        if (window.db && (ventaAntigua.firebaseId || id)) {
            const idRef = ventaAntigua.firebaseId || id;
            await window.db.ref("ventas").child(idRef).update({
                producto: nuevoNombre,
                cantidad: nuevaCant,
                valor: nuevoValor
            });
        }

        // 3. Actualizar localmente
        window.ventas[vIndex].producto = nuevoNombre;
        window.ventas[vIndex].cantidad = nuevaCant;
        window.ventas[vIndex].valor = nuevoValor;

        guardarDatosLocal();
        cerrarModalEditar();
        mostrarVentas();      // Refresca lista central
        renderInventarioUI(); // Refresca ventana lateral derecha
        
        if (typeof renderInventarioTabla === 'function') renderInventarioTabla();

    } catch (error) {
        console.error("Error al guardar edición:", error);
        alert("Hubo un error al guardar los cambios.");
    }
}


  async function eliminarProducto(ventaObj) {
    if (!confirm(`¿Eliminar la línea de "${ventaObj.producto}"? El stock se devolverá al inventario.`)) return;

    // 1. Devolver Stock al Inventario
    if (ventaObj.idInventario) {
        const itemInv = window.inventario.find(p => p.codigo === ventaObj.idInventario);
        if (itemInv) {
            itemInv.cantidad += (parseInt(ventaObj.cantidad) || 0); // Sumar lo que se había vendido
            
            if (window.db) {
                const refInv = window.db.ref("inventario");
                const snap = await refInv.orderByChild("codigo").equalTo(ventaObj.idInventario).once("value");
                if (snap.exists()) {
                    const key = Object.keys(snap.val())[0];
                    await refInv.child(key).child("cantidad").set(itemInv.cantidad);
                }
            }
        }
    }

    // 2. Eliminar de Firebase
    if (window.db && (ventaObj.firebaseId || ventaObj.uuid)) {
        const idEliminar = ventaObj.firebaseId || ventaObj.uuid;
        await window.db.ref("ventas").child(idEliminar).remove();
    }

    // 3. Limpieza local
    window.ventas = window.ventas.filter(v => (v.firebaseId || v.uuid) !== (ventaObj.firebaseId || ventaObj.uuid));

    guardarDatosLocal();
    mostrarVentas();
    renderInventarioUI(); // 🔥 Actualiza ventana derecha
    if (typeof renderInventarioTabla === 'function') renderInventarioTabla(); // 🔥 Actualiza hoja inventario
}
// ===============================
// 🔥 INVENTARIO UI
// ===============================

function renderInventarioUI() {
    const lista = document.getElementById('lista-inventario');
    if (!lista) return;
    lista.innerHTML = '';

    // Usamos el inventario global que ya tiene los descuentos aplicados
    let inventarioValido = [...(window.inventario || [])];

    // Ocultamos lo que no tiene stock y ordenamos por código
    inventarioValido = inventarioValido.filter(p => Number(p.cantidad) > 0);
    inventarioValido.sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es', { numeric: true }));

    inventarioValido.forEach(producto => {
        const div = document.createElement('div');
        div.className = 'producto-inventario';
        // Estilo visual para resaltar el cambio
        div.innerHTML = `
            <span style="flex:1;">${producto.codigo ? producto.codigo + ' - ' : ''}${producto.nombre}</span>
            <span style="font-weight:bold; color:#007bff; background: #e0f0ff; padding: 2px 6px; border-radius: 4px;">${producto.cantidad}</span>
        `;
        lista.appendChild(div);
    });
    
    // Actualizamos la hora de la última actualización visual
    const stiloHora = document.getElementById('inventario-ultima');
    if (stiloHora) stiloHora.textContent = new Date().toLocaleTimeString();
}

function autocompletarVentaPorId() {
  const id = document.getElementById("venta-id").value.trim();
  if (!id) {
    document.getElementById("venta-producto").value = "";
    document.getElementById("stock-disponible").textContent = 0;
    return;
  }

  const producto = window.inventario ? window.inventario.find(p => p.codigo === id) : null;

  if (producto) {
    document.getElementById("venta-producto").value = producto.nombre;
    document.getElementById("stock-disponible").textContent = producto.cantidad;
  } else {
    document.getElementById("venta-producto").value = "";
    document.getElementById("stock-disponible").textContent = 0;
  }
}

 // ===================================================
// 🔥 GUARDAR VENTA CON SOPORTE OFFLINE
// ===================================================
function estaOnline() {
    return navigator.onLine;
}

async function guardarVentaEnFirebase(ventaObj) {
    if (estaOnline()) {
        try {
            const ref = window.db.ref("ventas").push();
            await ref.set(ventaObj);
            console.log("✔ Venta guardada en Firebase");
        } catch (e) {
            console.error("Error subiendo venta:", e);
            guardarVentaOffline(ventaObj);
        }
    } else {
        guardarVentaOffline(ventaObj);
    }
}

// ===================================================
// 🔥 GUARDAR VENTA LOCAL CUANDO NO HAY INTERNET
// ===================================================
function guardarVentaOffline(ventaObj) {
    let pendientes = JSON.parse(localStorage.getItem("pendientesSubir") || "[]");
    pendientes.push(ventaObj);
    localStorage.setItem("pendientesSubir", JSON.stringify(pendientes));
    console.log("📌 Venta guardada localmente (offline)");
}

// ===================================================
// 🔥 SUBIR AUTOMÁTICAMENTE CUANDO VUELVE INTERNET
// ===================================================
// ========== 🔄 SINCRONIZADOR AUTOMÁTICO ==========
setInterval(async () => {
    if (!navigator.onLine || !window.db) return;

    if (!window.ventasPendientes) window.ventasPendientes = [];

    if (window.ventasPendientes.length === 0) return;

    console.log("🔄 Intentando subir ventas pendientes...");

    const pend = [...window.ventasPendientes];
    window.ventasPendientes = [];

    for (let venta of pend) {
        try {
            const ventaFB = { ...venta };
            delete ventaFB.uuid;
            delete ventaFB.pendiente;

            const ref = await window.db.ref("ventas").push(ventaFB);
            venta.firebaseId = ref.key;

        } catch (e) {
            console.warn("Error sincronizando una venta:", e);
            venta.pendiente = true;
            window.ventasPendientes.push(venta);
        }
    }

    guardarDatosLocal();
}, 5000);

</script>
